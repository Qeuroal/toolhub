[preview]
wrap = "yes"

[opener]
edit = [
  { run = '${EDITOR:-nvim} %s', desc = "$EDITOR", block = true, for = "unix" },
  { run = 'nvim %s', desc = "nvim", block = true, for = "windows" },
]
imageedit = [
  { run = 'gimp %s', desc = "Gimp", for = "unix" },
]
open = [
  { run = 'linkhandler %s1', block = true, desc = "Open", for = "linux" },
  { run = 'open %s', desc = "Open", for = "macos" },
  { run = 'start "" %s1', desc = "Open", for = "windows" },
]
reveal = [
  { run = 'xdg-open %d1', desc = "Reveal", for = "linux" },
  { run = 'open -R %s1', desc = "Reveal", for = "macos" },
  { run = '''exiftool %s1; echo "Press enter to exit"; read _''', block = true, desc = "Show EXIF", for = "unix" },
]
extract = [
  { run = 'ya pub extract --list %s', desc = "Extract here", for = "unix" },
  { run = 'ya pub extract --list %s', desc = "Extract here", for = "windows" },
]
play = [
  { run = 'open -a VLC %s', orphan = true, for = "macos" },
  { run = 'mpv --force-window %s', orphan = true, for = "unix" },
  { run = '''mediainfo %s1; echo "Press enter to exit"; read _''', block = true, desc = "Show media info", for = "unix" },
  { run = '"C:\Program Files\mpv.exe" %s', orphan = true, for = "windows" },
]

[mgr]
# Sort naturally
sort_by = "natural"
sort_sensitive = true
sort_dir_first = true
sort_reverse = false
linemode = "size"
show_hidden = false
show_symlink = true
mouse_events = []

[open]
rules = [
  # Folder
  { mime = "inode/directory", use = [ "edit", "open", "reveal" ] },
  { url = "*/", use = [ "edit", "open", "reveal" ] },
  # Office
  { url = "*.{doc,docx,pdf,xls,xlsx,ppt,pptx}", use = [ "open", "reveal" ] },
  # MPEG transport stream
  { url = "*.ts", use = [ "play", "reveal" ] },
  # Text
  { mime = "text/*", use = [ "edit", "open", "reveal" ] },
  # Image
  { mime = "image/*", use = [ "open", "imageedit", "reveal" ] },
  # Media
  { mime = "{audio,video}/*", use = [ "play", "reveal" ] },
  # Archive
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal" ] },
  # JSON
  { mime = "application/{json,ndjson}", use = [ "edit", "open", "reveal" ] },
  { mime = "*/javascript", use = [ "edit", "reveal" ] },
  # Empty file
  { mime = "inode/empty", use = [ "edit", "reveal" ] },
  # Fallback
  { url = "*", use = [ "edit", "open", "reveal" ] },
]

[input]
cursor_blink = false
