# Set the theme to use with the terminal
include ./macchiato.conf

# 允许其他程序控制kitty
allow_remote_control yes

# https://sw.kovidgoyal.net/kitty/faq/#kitty-is-not-able-to-use-my-favorite-font
symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono
# 对勾符号
symbol_map U+2700-U+27BF Zapf Dingbats
# symbol_map U+21E1 DejaVu Sans

# font
font_family      family="JetBrainsMonoNL Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_feature     auto

# 允许调整字符宽度
# enable_text_sizing yes

# fontsize
font_size   19.5

disable_ligatures never
adjust_column_width 0
modify_font cell_height 100%
box_drawing_scale 0.001, 1, 1.5, 2

# cursor
cursor_shape            block
cursor_beam_thickness   4.0
cursor_underline_thickness 4.0
cursor_shape_unfocused  hollow
cursor_blink_interval   0
cursor #ff6347
cursor_text_color #ffffff
shell_integration no-cursor


# Set up the window margin
window_margin_width 0
# hide_window_decorations titlebar-only
macos_titlebar_color background

# Set up the background
background_opacity 0.95
background_blur 6

# window_border_width 20pt

# URLs
url_style double
# open_url_modifiers ctrl+shift
open_url_with default
# copy_on_select yes

# Selection
# rectangle_select_modifiers ctrl+shift
select_by_word_characters :@-./_~?&=%+#

# Mouse
click_interval 0.5
mouse_hide_wait 0
focus_follows_mouse no
mouse_map ctrl+left click ungrabbed mouse_handle_click selection link prompt

# Performance
repaint_delay    20
input_delay 2
sync_to_monitor no

# Bell
visual_bell_duration 0.0
enable_audio_bell no

# Window
remember_window_size   yes
# initial_window_width   700
# initial_window_height  400
window_border_width 0.1
window_margin_width 0
window_padding_width 0
inactive_text_alpha 1.0
background_opacity 1.0
# dynamic_background_opacity yes

# Layouts
enabled_layouts splits:split_axis=horizontal, stack

# Tabs
tab_bar_edge top
tab_bar_min_tabs 1
tab_separator " ┇"
active_tab_font_style bold
inactive_tab_font_style normal
tab_bar_style powerline
# tab_bar_style slant
# tab_bar_style hidden
# tab_powerline_style         round
# tab_title_template "{index}:{(title.split(' ')[1] + ' (' + title.split(' ')[-1] + ')') if title.split(' ')[0]=='nvim' else title}"
# tab_title_template " {index} {f'{title[:6]}…{title[-6:]}' if title.rindex(title[-1]) + 1 > 13 else title.center(7)} "
# tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
# tab_title_template "{index}: {title}"
tab_title_template "{fmt.bold}{index}{fmt.nobold}:{'/'.join(title.split('/')[-2:])}"

# Scrollback
scrollback_lines 10000
scrollback_pager /usr/bin/less
scrollback_pager nvim --noplugin -u ~/.config/kitty/scrollback-pager/nvim/init.vim -c "silent write! /tmp/kitty_scrollback_buffer | te cat /tmp/kitty_scrollback_buffer - "
wheel_scroll_multiplier 5.0

# clipboard
clipboard_control write-clipboard write-primary read-clipboard read-primary

# Shell
shell .
shell_integration no-cursor
close_on_child_death no
allow_remote_control yes
# term xterm-256color
term xterm-kitty

# key
macos_option_as_alt left

# Create new tab with current directory.
# clear_all_shortcuts yes
map cmd+t new_tab_with_cwd
# Close tabs.
map cmd+w close_tab
# Goto specefic tabs.
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+10 goto_tab 0

map ctrl+shift+up        scroll_line_up
map ctrl+shift+down      scroll_line_down
map ctrl+shift+u         scroll_page_up
map ctrl+shift+d         scroll_page_down
# map ctrl+shift+k         scroll_line_up
# map ctrl+shift+j         scroll_line_down
map ctrl+shift+page_up   scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home      scroll_home
map ctrl+shift+end       scroll_end

map ctrl+shift+t    	set_tab_title

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard


